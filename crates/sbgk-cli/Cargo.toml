[package]
name = "sbgk-cli"
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "sbgk"
path = "src/main.rs"

[dependencies]
sbgk-core = { path = "../sbgk-core" }
serde_json = "1"
# the index beside a journal (SPEC_V02_STEP6_7, step 6), with the SQLite source built in
rusqlite = { version = "0.32", features = ["bundled"] }
